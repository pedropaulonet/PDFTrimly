name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev desktop-file-utils file patchelf libfontconfig1 libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libxfixes3 libxrender1 libxcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libxkbcommon-x11-0
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build optimized executable
        run: cargo build --release --locked
      - name: Dependency metadata
        shell: bash
        run: |
          mkdir -p dist
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > dist/metadata.json
      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: python scripts/package.py windows --metadata dist/metadata.json
      - name: Package Linux DEB and AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          desktop-file-validate assets/pdftrimly.desktop
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -o dist/linuxdeploy.AppImage
          curl --fail --location --retry 3 -H 'Accept: application/octet-stream' https://api.github.com/repos/AppImage/type2-runtime/releases/assets/596078161 -o dist/appimage-runtime
          python3 scripts/package.py linux --metadata dist/metadata.json --linuxdeploy dist/linuxdeploy.AppImage --runtime dist/appimage-runtime
      - name: Upload executable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFTrimly-${{ matrix.platform }}-x86_64
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download both platform packages
        run: |
          gh run download "$GITHUB_RUN_ID" --name PDFTrimly-windows-x86_64 --dir packages/windows
          gh run download "$GITHUB_RUN_ID" --name PDFTrimly-linux-x86_64 --dir packages/linux
      - name: Prepare release assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          (cd packages/windows && sha256sum --check SHA256SUMS)
          (cd packages/linux && sha256sum --check SHA256SUMS)
          mkdir release
          cp packages/windows/pdftrimly.exe release/
          cp "packages/linux/pdftrimly_${version}_amd64.deb" release/
          cp "packages/linux/PDFTrimly-${version}-x86_64.AppImage" release/
          cp packages/windows/LICENSE release/
          python3 -c 'import os, shutil; shutil.make_archive("release/PDFTrimly-" + os.environ["RELEASE_TAG"] + "-windows-x86_64", "zip", "packages/windows")'
          (cd release && sha256sum pdftrimly.exe *.deb *.AppImage *.zip LICENSE > SHA256SUMS)
      - name: Publish release with all executables
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            if [[ "$(cat release-state)" == "false" ]]; then
              echo "Release already published; leaving its assets intact."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PDFTrimly $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          prerelease=false
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
